<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لالایی</title>

<style>
@font-face{font-family:Vazirmatn;font-weight:400;src:url(fonts/Vazirmatn-Regular.woff2) format('woff2')}
@font-face{font-family:Vazirmatn;font-weight:600;src:url(fonts/Vazirmatn-SemiBold.woff2) format('woff2')}
@font-face{font-family:Vazirmatn;font-weight:800;src:url(fonts/Vazirmatn-ExtraBold.woff2) format('woff2')}
:root{
  --bg1:#0f1535; --bg2:#1d1b4a; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --text:#f3f1ff; --muted:#a9a6d6; --accent:#ffd27a; --accent2:#9b8cff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,sans-serif;color:var(--text);min-height:100vh;
  background:radial-gradient(circle at 80% 0%,#3a2f7a 0,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));
  display:flex;justify-content:center}
.app{width:100%;max-width:440px;padding:20px 16px 190px;position:relative}
.stars{position:fixed;inset:0;pointer-events:none;background-image:
  radial-gradient(1.5px 1.5px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 70% 15%,#fff8,transparent),
  radial-gradient(1.5px 1.5px at 40% 70%,#fff6,transparent),radial-gradient(1px 1px at 85% 55%,#fff7,transparent),
  radial-gradient(1px 1px at 10% 85%,#fff6,transparent)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:26px;font-weight:800}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.moon{width:54px;height:54px;border-radius:50%;background:var(--accent);box-shadow:0 0 40px #ffd27a88;position:relative}
.moon::after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:var(--bg1);top:-6px;left:-8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;scrollbar-width:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);font:inherit;font-size:14px}
.chip.on{background:var(--accent2);color:#fff;border-color:transparent}
.timer{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:18px}
.timer b{font-size:15px}.timer span{font-size:13px;color:var(--muted)}
.timer .t{margin-inline-start:auto;display:flex;gap:6px}
.timer .t button{font:inherit;font-size:13px;border:0;border-radius:10px;padding:6px 10px;background:#ffffff14;color:var(--text)}
.timer .t button.on{background:var(--accent);color:#2a2150}
.list{display:flex;flex-direction:column;gap:10px}
.song{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.song.on{border-color:var(--accent);background:#ffd27a14}
.ico{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px}
.song .n{flex:1;min-width:0}.song .n b{display:block;font-size:15px;font-weight:600}
.song .n span{font-size:12px;color:var(--muted)}
.fav{background:none;border:0;font-size:20px;color:var(--muted)}
.fav.on{color:#ff8fab}
.player{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(20,18,55,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);border-radius:24px 24px 0 0}
.now{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.now .n b{font-size:15px}.now .n span{display:block;font-size:12px;color:var(--muted)}
.bar{height:4px;border-radius:4px;background:#ffffff1f;margin-bottom:4px;overflow:hidden}
.bar i{display:block;height:100%;width:38%;background:var(--accent)}
.time{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;direction:ltr}
.ctrl{display:flex;align-items:center;justify-content:center;gap:28px}
.ctrl button{background:none;border:0;color:var(--text);font-size:22px}
.ctrl button.on{color:var(--accent)}
.ctrl button:not(.play){opacity:.85}
#rep:not(.on),#shuf:not(.on){opacity:.4}
.bar{cursor:pointer}
.myket{display:flex;gap:10px;margin-top:18px}
.myket button{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.ctrl .play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#2a2150;font-size:24px;box-shadow:0 6px 24px #ffd27a55}
</style>
</head>
<body>
<div class="stars"></div>
<main class="app">
  <header>
    <h1>لالایی<small>شب بخیر کوچولو 🌙</small></h1>
    <div class="moon"></div>
  </header>

  <div class="chips" id="chips">
    <button class="chip on" data-f="all">همه</button>
    <button class="chip" data-f="کوتاه">لالایی‌های کوتاه</button>
    <button class="chip" data-f="بلند">لالایی‌های بلند</button>
    <button class="chip" data-f="محلی">محلی</button>
    <button class="chip" data-f="کودک">ترانه‌ی کودک</button>
    <button class="chip" data-f="بی‌کلام">بی‌کلام و خارجی</button>
    <button class="chip" data-f="fav">❤ علاقه‌مندی</button>
  </div>

  <div class="timer">
    <div><b>⏱ خاموشی خودکار</b><br><span id="timerTxt">خاموش</span></div>
    <div class="t" id="timer"><button data-m="0" class="on">—</button><button data-m="15">۱۵</button><button data-m="30">۳۰</button><button data-m="60">۶۰</button></div>
  </div>

  <div class="list" id="list"></div>
  <div class="myket"><button id="rate">⭐ امتیاز و نظر</button><button id="more">📱 برنامه‌های دیگر ما</button></div>
</main>

<div class="player">
  <div class="now">
    <div class="ico" id="nowIco" style="background:#ffd27a33">🌙</div>
    <div class="n"><b id="nowTitle">یه لالایی انتخاب کن</b><span id="nowSub">&nbsp;</span></div>
  </div>
  <div class="bar" id="bar"><i id="prog" style="width:0"></i></div>
  <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctrl">
    <button id="rep" title="تکرار">🔁</button><button id="next" title="بعدی">⏭</button><button class="play" id="play">▶</button><button id="prev" title="قبلی">⏮</button><button id="shuf" title="تصادفی">🔀</button>
  </div>
  <audio id="audio" preload="none"></audio>
</div>

<script src="songs.js"></script>
<script>
const fa=n=>n.toLocaleString('fa');
const songs=window.SONGS.map((s,i)=>({...s,i}));
const sub=c=>c=="کودک"?"ترانه‌ی کودک":c=="محلی"?"لالایی محلی":c=="بی‌کلام"?"بی‌کلام و خارجی":"لالایی "+c;
const $=id=>document.getElementById(id), A=$('audio');
let store={};try{store=JSON.parse(localStorage.getItem('lalaei')||'{}')}catch(e){}
const favs=new Set(store.favs||[]);
const save=()=>{try{localStorage.setItem('lalaei',JSON.stringify({favs:[...favs]}))}catch(e){}};
let filter='all', cur=-1, repeat=false, shuffle=false, timerEnd=0, timerId;
const visible=()=>songs.filter(s=>filter=='all'||(filter=='fav'?favs.has(s.i):s.c==filter));
function render(){
  const list=$('list');list.innerHTML='';const v=visible();
  if(!v.length){list.innerHTML='<div class="empty">هنوز چیزی اینجا نیست</div>';return}
  v.forEach(s=>{
    const el=document.createElement('div');el.className='song'+(s.i==cur?' on':'');
    const f=favs.has(s.i);
    el.innerHTML=`<div class="ico" style="background:${s.bg}">${s.e}</div>
     <div class="n"><b>${s.t}</b><span>${sub(s.c)}</span></div><button class="fav${f?' on':''}">${f?'♥':'♡'}</button>`;
    el.onclick=e=>{
      if(e.target.classList.contains('fav')){favs.has(s.i)?favs.delete(s.i):favs.add(s.i);save();render();return}
      s.i==cur?toggle():play(s.i)};
    list.appendChild(el)})}
function play(i){
  cur=i;const s=songs[i];A.src=s.src;A.play();
  $('nowTitle').textContent=s.t;$('nowSub').textContent=sub(s.c);
  $('nowIco').textContent=s.e;$('nowIco').style.background=s.bg;render()}
function toggle(){if(cur<0)return play(visible()[0].i);A.paused?A.play():A.pause()}
function step(d){
  const v=visible().length?visible():songs;if(cur<0)return play(v[0].i);
  if(shuffle)return play(v[Math.floor(Math.random()*v.length)].i);
  const k=v.findIndex(s=>s.i==cur);play(v[(k+d+v.length)%v.length].i)}
const mmss=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
A.onplay=A.onpause=()=>{$('play').textContent=A.paused?'▶':'⏸';
  // tell the Android app so it keeps a playback notification while audio plays
  if(window.Native)try{Native.playing(!A.paused,cur<0?'':songs[cur].t)}catch(e){}};
window.nativeToggle=()=>toggle();
const len=()=>isFinite(A.duration)&&A.duration>0?A.duration:(cur<0?0:songs[cur].d);
A.ontimeupdate=()=>{$('cur').textContent=mmss(A.currentTime);$('dur').textContent=mmss(len());
  $('prog').style.width=(len()?Math.min(100,A.currentTime/len()*100):0)+'%'};
A.onended=()=>repeat?(A.currentTime=0,A.play()):step(1);
$('bar').onclick=e=>{if(!len())return;const r=e.currentTarget.getBoundingClientRect();
  A.currentTime=(r.right-e.clientX)/r.width*len()};
$('play').onclick=toggle;$('next').onclick=()=>step(1);$('prev').onclick=()=>step(-1);
$('rep').onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle('on',repeat)};
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle)};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==b));filter=b.dataset.f;render()};
// sleep timer: fade out over last 20s, then stop
$('timer').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#timer button').forEach(x=>x.classList.toggle('on',x==b));
  clearInterval(timerId);A.volume=1;const m=+b.dataset.m;
  if(!m){timerEnd=0;$('timerTxt').textContent='خاموش';return}
  timerEnd=Date.now()+m*60000;
  timerId=setInterval(()=>{const left=(timerEnd-Date.now())/1000;
    if(left<=0){A.pause();A.volume=1;clearInterval(timerId);$('timerTxt').textContent='خاموش';
      document.querySelectorAll('#timer button').forEach((x,j)=>x.classList.toggle('on',j==0));return}
    if(left<20)A.volume=Math.max(0,left/20);
    $('timerTxt').textContent=fa(Math.ceil(left/60))+' دقیقه‌ی دیگه قطع می‌شه'},1000)};
// Myket intents: rate page and developer's other apps (handled by the Android app)
$('rate').onclick=()=>window.Native?Native.myket('rate'):open('https://myket.ir/app/ir.lalaei.app');
$('more').onclick=()=>window.Native?Native.myket('dev'):open('https://myket.ir/app/ir.lalaei.app');
// keep the last songs above the fixed player, whatever its height
const fitPad=()=>document.querySelector('.app').style.paddingBottom=(document.querySelector('.player').offsetHeight+24)+'px';
addEventListener('resize',fitPad);addEventListener('load',fitPad);fitPad();
render();
</script>
</body>
</html>
