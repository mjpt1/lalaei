<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اپلیکیشن لالایی‌های رویایی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1e293b;
        }

        /* کانتینر گوشی موبایل */
        .phone-container {
            width: 100%;
            max-width: 390px;
            height: 800px;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #0f172a;
        }

        /* بخش بالایی هدر و بنر */
        .header-banner {
            padding: 30px 20px 20px;
            text-align: center;
            color: white;
            position: relative;
        }

        .moon-art {
            width: 90px;
            height: 90px;
            background: #fef08a;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(254, 240, 138, 0.6);
            position: relative;
        }

        .moon-art i {
            font-size: 45px;
            color: #ca8a04;
        }

        .header-banner h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #f8fafc;
        }

        .header-banner p {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 300;
        }

        /* لیست آهنگ‌ها */
        .playlist-container {
            flex: 1;
            background-color: #f8fafc;
            border-radius: 30px 30px 0 0;
            padding: 20px 15px;
            overflow-y: auto;
            box-shadow: 0 -10px 20px rgba(0, 0, 0, 0.1);
        }

        .track-card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .track-card:hover {
            transform: translateY(-2px);
        }

        .track-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4f46e5;
            font-size: 20px;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .track-info {
            flex: 1;
        }

        .track-title {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .progress-bar-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: #6366f1;
            border-radius: 3px;
        }

        .track-time {
            font-size: 10px;
            color: #64748b;
            white-space: nowrap;
        }

        .play-btn {
            width: 38px;
            height: 38px;
            background: #3b82f6;
            border: none;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-right: 12px;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
            flex-shrink: 0;
        }

        /* ناوبری پایین صفحه */
        .bottom-nav {
            background: white;
            height: 65px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding: 0 10px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
            gap: 3px;
        }

        .nav-item.active {
            color: #3b82f6;
        }

        .nav-item i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- بنر بالایی اپ -->
        <div class="header-banner">
            <div class="moon-art">
                <i class="fa-solid fa-moon"></i>
            </div>
            <h1>لالایی‌های رویایی</h1>
            <p>موزیک آرامش‌بخش برای خواب آرام دلبندتان</p>
        </div>

        <!-- لیست موزیک‌ها و لالایی‌ها -->
        <div class="playlist-container">
            <!-- ترک اول -->
            <div class="track-card">
                <div class="track-icon">
                    <i class="fa-solid fa-child"></i>
                </div>
                <div class="track-info">
                    <div class="track-title">ستاره کوچولو</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 40%;"></div>
                        </div>
                        <span class="track-time">۱:۲۴ / ۳:۱۲</span>
                    </div>
                </div>
                <button class="play-btn">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>

            <!-- ترک دوم -->
            <div class="track-card">
                <div class="track-icon" style="background: #fae8ff; color: #d946ef;">
                    <i class="fa-solid fa-cloud-moon"></i>
                </div>
                <div class="track-info">
                    <div class="track-title">لالایی لالایی گل پونه</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 25%; background: #d946ef;"></div>
                        </div>
                        <span class="track-time">۰:۵۶ / ۲:۴۸</span>
                    </div>
                </div>
                <button class="play-btn" style="background: #d946ef; box-shadow: 0 4px 10px rgba(217, 70, 239, 0.4);">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>

            <!-- ترک سوم -->
            <div class="track-card">
                <div class="track-icon" style="background: #fef9c3; color: #ca8a04;">
                    <i class="fa-solid fa-star"></i>
                </div>
                <div class="track-info">
                    <div class="track-title">فرشته کوچولو بخواب</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 60%; background: #eab308;"></div>
                        </div>
                        <span class="track-time">۱:۱۰ / ۳:۲۰</span>
                    </div>
                </div>
                <button class="play-btn" style="background: #eab308; box-shadow: 0 4px 10px rgba(234, 179, 8, 0.4);">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>

            <!-- ترک چهارم -->
            <div class="track-card">
                <div class="track-icon" style="background: #ccfbf1; color: #0d9488;">
                    <i class="fa-solid fa-music"></i>
                </div>
                <div class="track-info">
                    <div class="track-title">آهنگ ملایم جعبه موسیقی</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 30%; background: #14b8a6;"></div>
                        </div>
                        <span class="track-time">۰:۴۸ / ۳:۰۵</span>
                    </div>
                </div>
                <button class="play-btn" style="background: #14b8a6; box-shadow: 0 4px 10px rgba(20, 184, 166, 0.4);">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>
        </div>

        <!-- ناوبری پایین صفحه -->
        <div class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>خانه</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-list-music"></i>
                <span>پلی‌لیست</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-heart"></i>
                <span>علاقه‌مندی</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>تنظیمات</span>
            </a>
        </div>
    </div>

</body>
</html>
